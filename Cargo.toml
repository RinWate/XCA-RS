[package]
name = "xca-rs"
version = "0.2.0"
edition = "2024"
description = "XCA (X Certificate and Key Management) rewritten in Rust with GTK4 + libadwaita"
license = "GPL-2.0-or-later"

[dependencies]
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_12"] }
libadwaita = { version = "0.9.2", features = ["v1_5"] }
openssl = { version = "0.10" }
openssl-sys = "0.9"
# Must match the foreign-types line used by openssl 0.10 itself (0.3);
# the 0.5 line is a different, incompatible ForeignTypeRef trait.
foreign-types = "0.3"
cryptoki = "0.12"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher"] }
rust-i18n = "4.2.2"
